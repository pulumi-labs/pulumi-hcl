# Notifications (statuses, PR comment) are sent by the ci.yml codecov-notify
# job after every test shard has uploaded; automatic per-upload notification
# would compute statuses from partial coverage and post false failures.
codecov:
  notify:
    manual_trigger: true

ignore:
  - "tests/testutil/tfcompat/providers"
  # Third-party code copied verbatim from upstream and regenerated by
  # vendored/scripts/regen.sh. We do not write it and do not test it; CI
  # enforces that it matches upstream instead (the vendored-drift job).
  - "vendored"
