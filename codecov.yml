# Don't trigger until asked by CI
codecov:
  notify:
    manual_trigger: true

coverage:
  status:
    project:
      default:
        threshold: 0.5%

ignore:
  - "tests/testutil/tfcompat/providers"
  # Third-party code copied verbatim from upstream and regenerated by
  # vendored/scripts/regen.sh. We do not write it and do not test it; CI
  # enforces that it matches upstream instead (the vendored-drift job).
  - "vendored"
