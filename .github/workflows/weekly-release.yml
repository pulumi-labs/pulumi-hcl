name: Weekly release

on:
  schedule:
    # Mondays at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  weekly-release:
    runs-on: ubuntu-latest
    steps:
      - name: Find the release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --head automation/next-release --state open \
            --json number,title,url --jq '.[0] // empty' > pr.json
          if [ -s pr.json ]; then
            {
              echo "number=$(jq -r .number pr.json)"
              echo "title=$(jq -r .title pr.json)"
              echo "url=$(jq -r .url pr.json)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release PR
        if: steps.pr.outputs.number != ''
        env:
          # Use the PAT so the merge commit to master triggers release.yml;
          # pushes made with GITHUB_TOKEN don't trigger workflows.
          GH_TOKEN: ${{ secrets.PULUMI_BOT_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Compose Slack message
        id: msg
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "text=Merged the \`pulumi-hcl\` release PR ($PR_TITLE); the release is on its way. $PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "text=No \`pulumi-hcl\` release this week — no unreleased changes." >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack (#team-iac-core)
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          payload: |
            channel: "#team-iac-core"
            text: "${{ steps.msg.outputs.text }}"

      - name: Notify Slack (#project-hcl)
        # Only worth a ping in the project channel when something actually shipped.
        if: steps.pr.outputs.number != ''
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          payload: |
            channel: "#project-hcl"
            text: "${{ steps.msg.outputs.text }}"
