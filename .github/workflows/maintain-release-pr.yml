name: Maintain Release PR

on:
  push:
    branches: [master]
    paths:
      - '.changes/unreleased/**'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Merge the resulting PR immediately after refresh/create'
        type: boolean
        default: false

# Serialize runs so back-to-back merges to master refresh the release PR
# in order rather than racing each other on the `automation/next-release` branch.
concurrency:
  group: maintain-release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the PAT so the `git push` below and the PR-event side-effects
          # come from a user identity, not GITHUB_TOKEN. PRs/pushes authored by
          # GITHUB_TOKEN don't trigger pull_request workflows, which would leave
          # the release PR with no required-check coverage.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: jdx/mise-action@v4

      - name: Check for unreleased changes
        id: check
        run: |
          set +e
          output=$(changie batch auto --dry-run 2>&1)
          status=$?
          set -e
          if [ $status -ne 0 ] && echo "$output" | grep -q "no unreleased changes"; then
            echo "No unreleased changes — nothing to release."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          elif [ $status -eq 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changie failed unexpectedly:"
            echo "$output"
            exit $status
          fi

      - name: Batch unreleased changes
        if: steps.check.outputs.has-changes == 'true'
        run: changie batch auto

      - name: Merge into CHANGELOG.md
        if: steps.check.outputs.has-changes == 'true'
        run: changie merge

      - name: Get the new version
        if: steps.check.outputs.has-changes == 'true'
        id: latest
        run: echo "version=$(changie latest)" >> "$GITHUB_OUTPUT"

      - name: Open or refresh release PR
        if: steps.check.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.latest.outputs.version }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          set -euo pipefail
          BRANCH="automation/next-release"
          TITLE="Changelog for ${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .changes CHANGELOG.md
          git commit -m "$TITLE"
          git push --force --set-upstream origin "$BRANCH"

          BODY=$(cat <<EOF
          \`\`\`markdown
          $(cat ".changes/${VERSION}.md")
          \`\`\`

          ---

          Merging this PR to \`master\` will trigger \`.github/workflows/release.yml\`, which:

          - creates the \`${VERSION}\` git tag
          - publishes the GitHub release with notes from \`.changes/${VERSION}.md\`
          - builds and uploads binaries (\`pulumi-language-hcl\`, \`pulumi-converter-hcl\`) for \`{darwin, linux, windows} × {amd64, arm64}\`

          Automated release PR generated by \`.github/workflows/maintain-release-pr.yml\`.
          EOF
          )

          # Refresh the existing PR (force-push above already updated the branch);
          # keep the title and body in sync with the freshly-computed VERSION.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for ${BRANCH}; updating title to '${TITLE}'."
            gh pr edit "$existing" --title "$TITLE" --body "$BODY"
            PR="$existing"
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi

          if [ "${AUTO_MERGE:-false}" = "true" ]; then
            echo "Auto-merging PR #${PR}."
            gh pr merge "$PR" --squash --auto --delete-branch
          fi
