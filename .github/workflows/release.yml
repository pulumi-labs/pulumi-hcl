name: Release

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Add env vars
        id: version
        run: |
          LATEST="$(changie latest)"
          echo "GORELEASER_CURRENT_TAG=$LATEST" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=.changes/$LATEST.md" >> "$GITHUB_ENV"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
      - name: Check if release tag already exists
        id: check-release
        run: |
          git fetch --tags --quiet
          if [ -z "$(git tag -l "${GORELEASER_CURRENT_TAG}")" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        if: steps.check-release.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ env.RELEASE_NOTES_PATH }} --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the Go SDK to our sdk-releases branch, then tag it.
  publish-go-sdk:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sdk-releases
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Read the Go toolchain from the released source
        run: |
          git fetch --depth 1 origin "refs/tags/${VERSION}"
          mkdir -p "${RUNNER_TEMP}/go-toolchain"
          git show "FETCH_HEAD:go.mod" > "${RUNNER_TEMP}/go-toolchain/go.mod"
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/go-toolchain/go.mod
      - uses: pulumi/actions@v7
        with:
          pulumi-version: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Check if the Go SDK tag already exists
        id: already-tagged
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/sdk/go/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the released provider binary
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          asset="pulumi-resource-hcl-${VERSION}-linux-amd64.tar.gz"
          gh release download "${VERSION}" --pattern "${asset}" --dir "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" pulumi-resource-hcl
      - name: Generate the Go SDK into the sdk-releases branch
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          rm -rf sdk/go
          pulumi package gen-sdk "${RUNNER_TEMP}/pulumi-resource-hcl"
          cd sdk/go && go mod tidy
      - name: Copy README and LICENSE into the Go SDK module
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          git fetch --depth 1 origin "refs/tags/${VERSION}"
          git show "FETCH_HEAD:README.md" > sdk/go/README.md
          git show "FETCH_HEAD:LICENSE" > sdk/go/LICENSE
      - name: Commit, tag, and push
        if: steps.already-tagged.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No SDK changes for ${VERSION}; mirror branch already up to date."
          else
            git commit -m "${VERSION}"
            git push origin sdk-releases
          fi
          git tag "sdk/go/${VERSION}"
          git push origin "sdk/go/${VERSION}"
      - name: Warm the Go module proxy
        if: steps.already-tagged.outputs.exists == 'false'
        continue-on-error: true
        run: |
          warmdir="$(mktemp -d)"
          (cd "$warmdir" && go mod init warm &&
            go get "github.com/pulumi-labs/pulumi-hcl/sdk/go@${VERSION}")

  # Publish the TypeScript SDK to npm as @pulumi/hcl.
  #
  # publish-go-sdk regenerates every language's SDK onto the sdk-releases branch
  # (it runs `pulumi package gen-sdk` with no --language filter), so by the time
  # this job runs the branch holds the freshly versioned nodejs source.
  #
  # Publishing uses npm trusted publishing (OIDC): the id-token permission plus
  # the publish-npm environment stand in for an npm token. This requires a
  # trusted publisher for @pulumi/hcl configured on npmjs.org, bound to this
  # repository, workflow file, and environment.
  publish-nodejs:
    needs: publish-go-sdk
    runs-on: ubuntu-latest
    environment: publish-npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sdk-releases
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm meets the trusted-publishing floor
        run: npm install -g npm@11.5.1
      - name: Check if this version is already on npm
        id: published
        working-directory: sdk/nodejs
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        working-directory: sdk/nodejs
        run: |
          npm install
          npm run build
          cp package.json README.md bin/
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: sdk/nodejs/bin
        run: npm publish --access public
