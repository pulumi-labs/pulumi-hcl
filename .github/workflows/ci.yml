name: CI

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pulumi/actions@v7
        with:
          pulumi-version: dev
      - uses: opentofu/setup-opentofu@v2
      # terraform_remote_state lowers to the pulumi-terraform getLocalReference
      # invoke; the tfcompat harness disables plugin acquisition, so pre-install it.
      - run: pulumi plugin install resource terraform 6.0.2
      # The harness runs the language runtime in-process via PULUMI_DEBUG_LANGUAGES,
      # but the engine still resolves and installs the `hcl` language plugin before
      # attaching. Acquisition is disabled in-test, so pre-install it from cache;
      # otherwise concurrent cases each race to download it and hit GitHub rate limits.
      - run: pulumi plugin install language hcl --server github://api.github.com/pulumi-labs/pulumi-hcl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make test_cover
        env:
          # Enable the live terraform_remote_state `remote` backend test.
          TFE_ORGANIZATION: ${{ secrets.TFE_ORGANIZATION }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
      - uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  vendored-drift:
    # Ensures the vendored/ tree matches what `go generate ./vendored`
    # produces against the SHA pinned in vendored/doc.go. Catches both
    # hand-edits of MPL files and forgotten regens after a SHA bump.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go generate ./vendored
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- vendored/; then
            echo "::error::vendored/ tree drifted from regen output. Run 'go generate ./vendored' locally and commit the result."
            exit 1
          fi
