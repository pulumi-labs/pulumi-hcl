version: "2"

linters:
  enable:
    - modernize
    - usetesting
  settings:
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
  exclusions:
    # vendored/ contains MPL-2.0 code copied verbatim from upstream and
    # regenerated by go generate; we don't hand-edit it.
    paths:
      - vendored/
