changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
kinds:
  - label: Improvements
    auto: minor
  - label: Bug Fixes
    auto: patch
    key: bug-fixes
fragmentFileFormat: '{{.Custom.Component}}-{{.Kind}}-{{.Custom.PR}}'
changeFormat: '- [{{.Custom.Component}}] {{.Body}} [#{{.Custom.PR}}](https://github.com/pulumi-labs/pulumi-hcl/pull/{{.Custom.PR}})'
custom:
  - key: Component
    label: Component
    type: enum
    enumOptions:
      - language-host
      - converter
      - codegen
      - runtime
  - key: PR
    label: GitHub Pull Request or Issue Number
    type: int
newlines:
  afterVersion: 1
  afterChange: 1
  afterKind: 1
  afterChangelogHeader: 1
  endOfVersion: 1
envPrefix: CHANGIE_
